<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIカズオ 口パクデモ</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #01030a; color: #dfe6ff;
      font-family: "Yu Gothic UI", "Meiryo", "Hiragino Sans", system-ui, sans-serif; }
    #bg { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #wrap { position: fixed; left: 50%; bottom: 2vh; height: 94vh; aspect-ratio: 765 / 1024;
      transform: translateX(-50%); max-width: 100vw; }
    #char { position: absolute; inset: 0; transform-origin: 50% 92%;
      filter: drop-shadow(0 0 1.6vh rgba(70, 130, 255, 0.35)); }
    #char img, #char svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #ui { position: fixed; left: 12px; bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center;
      padding: 10px; background: rgba(8, 12, 28, 0.85); border: 1px solid rgba(120, 150, 230, 0.25);
      border-radius: 10px; font-size: 13px; max-width: calc(100vw - 24px); }
    body.hide-ui #ui { display: none; }
    button { padding: 8px 12px; background: #16214a; color: #dfe6ff; border: 1px solid #2c3d7a;
      border-radius: 7px; font: inherit; cursor: pointer; }
    button.active { background: #4f86ff; border-color: #9fbaff; color: #fff; }
    label { display: flex; gap: 6px; align-items: center; }
    #msg { color: #8f9ccc; }
  </style>
</head>
<body>
  <canvas id="bg"></canvas>
  <div id="wrap">
    <div id="char">
      <img src="kazuo_normal.svg" alt="AIカズオ">
      <svg viewBox="0 0 765 1024" aria-hidden="true">
        <defs><clipPath id="mClip"><path id="mClipPath"/></clipPath></defs>
        <!-- まばたき（目を肌色でかくして、閉じた目の線を描く） -->
        <g id="blink" visibility="hidden">
          <ellipse cx="301" cy="407" rx="38" ry="17" fill="#cddcf6"/>
          <ellipse cx="465" cy="405" rx="38" ry="17" fill="#cddcf6"/>
          <path d="M266,409 Q300,421 337,407 M429,407 Q465,419 501,409" fill="none" stroke="#0a1137" stroke-width="6" stroke-linecap="round"/>
        </g>
        <!-- 口 -->
        <path id="lipShade" fill="none" stroke="#9db9ee" stroke-width="5" stroke-linecap="round"/>
        <path id="mFill" fill="#121b52"/>
        <g clip-path="url(#mClip)">
          <ellipse id="tongue" fill="#5a7bd6"/>
          <rect id="teeth" fill="#f4f7ff"/>
        </g>
        <path id="mLine" fill="none" stroke="#0a1137" stroke-width="5.5" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
    </div>
  </div>

  <div id="ui">
    <button id="autoBtn" class="active">自動でしゃべる</button>
    <button id="micBtn">マイクで試す</button>
    <label>口の大きさ <input type="range" id="size" min="0.4" max="1.5" step="0.05" value="1"></label>
    <label>反応しきい値 <input type="range" id="th" min="-80" max="-20" step="1" value="-52"></label>
    <span id="msg">T長押しでも口パク／Hでこの枠を隠す</span>
  </div>

  <script src="../js/background.js"></script>
  <script src="../js/audio.js"></script>
  <script src="demo.js"></script>
</body>
</html>
