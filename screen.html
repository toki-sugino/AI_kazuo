<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIカズオ（投影画面）</title>
  <link rel="stylesheet" href="css/screen.css?v=202610270715">
</head>
<body>
  <div id="screen">
    <!-- 背景・カズオ・枠つきの画像/動画 -->
    <div id="kazuoStage">
      <canvas id="bg"></canvas>
      <div id="photoWrap" aria-hidden="true">
        <div id="photoFrame"><div id="frameSlot"></div></div>
      </div>
      <div id="charWrap">
        <div id="charSpin"><div id="charBounce"></div></div>
      </div>
    </div>
    <!-- 画像・動画を枠なしで画面いっぱいに -->
    <div id="fullMedia" aria-hidden="true"><div id="fullSlot"></div></div>
  </div>
  <div id="blackout"></div>

  <div id="hint">
    <p id="hintMain">操作画面の「投影開始」で全画面になります</p>
    <p id="hintSub">クリックしても全画面になります</p>
  </div>

  <script src="js/background.js?v=202610270715"></script>
  <script src="characters/config.js?v=202610270715"></script>
  <script src="js/traced-char.js?v=202610270715"></script>
  <script src="js/screen.js?v=202610270715"></script>
</body>
</html>
