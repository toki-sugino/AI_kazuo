<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIカズオ（投影画面）</title>
  <link rel="stylesheet" href="css/screen.css">
</head>
<body>
  <div id="screen">
    <!-- AIカズオモード：背景・キャラ・枠つきの画像/動画 -->
    <div id="kazuoStage">
      <canvas id="bg"></canvas>
      <div id="photoWrap" aria-hidden="true">
        <div id="photoFrame"><div id="frameSlot"></div></div>
      </div>
      <div id="charWrap">
        <div id="charBounce"></div>
      </div>
    </div>
    <!-- 画像・動画モード：枠なしで画面いっぱい -->
    <div id="fullMedia" aria-hidden="true"><div id="fullSlot"></div></div>
  </div>
  <div id="blackout"></div>

  <div id="hint">
    <p id="hintMain">操作画面の「投影開始」を押すと全画面になります</p>
    <p id="hintSub">うまくいかない時は、このウィンドウを液晶（プロジェクター）の画面に移してからクリックしてください。<br>
      操作はパソコン側の「操作画面」で行います。</p>
  </div>

  <script src="js/background.js"></script>
  <script src="characters/config.js"></script>
  <script src="js/traced-char.js"></script>
  <script src="js/screen.js"></script>
</body>
</html>
