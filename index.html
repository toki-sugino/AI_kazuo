<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIカズオ（操作画面）</title>
  <link rel="stylesheet" href="css/control.css?v=202610270159">
</head>
<body>
  <header id="topbar">
    <strong>AIカズオ</strong>
    <button id="openScreen" class="primary">投影開始</button>
    <button id="micToggle" class="dot">マイク</button>
  </header>
  <p id="notice" hidden></p>

  <main id="layout">
    <!-- 客席に映っているもの と 本番で押すボタン -->
    <section id="liveCol" class="card">
      <div id="previewBox"><iframe id="preview" src="screen.html?v=202610270159&preview=1" title="客席の画面" tabindex="-1"></iframe></div>
      <div class="meter" title="マイクの音量（白い線を越えると口が動く）">
        <div id="meterBar"></div>
        <div id="meterThreshold"></div>
      </div>

      <div class="btnGrid three stage">
        <button id="kazuoBtn" class="toggle">カズオ <kbd>K</kbd></button>
        <button id="fullBtn" class="toggle">画像を全画面 <kbd>F</kbd></button>
        <button id="bootBtn" class="toggle">暗転 <kbd>B</kbd></button>
      </div>

      <div class="btnGrid five" id="exprBtns"></div>
      <div class="btnGrid four" id="presetBtns"></div>
      <div class="btnGrid two">
        <button id="muteBtn" class="toggle">ミュート <kbd>M</kbd></button>
        <button id="testMouth">テスト口パク <kbd>T</kbd></button>
      </div>
    </section>

    <!-- 画像・動画（カード全体にドラッグ＆ドロップできる） -->
    <section id="photoCol" class="card">
      <div class="colHead">
        <h2>画像・動画</h2>
        <label class="fileBtn">＋ 追加<input type="file" id="photoInput" accept="image/*,video/*" multiple hidden></label>
        <button id="hidePhoto">消す <kbd>0</kbd></button>
      </div>
      <div id="dropZone">
        <ol id="photoList"></ol>
        <p id="dropHint">ここにドラッグ＆ドロップ</p>
      </div>

      <div id="videoCtl" hidden>
        <div class="row">
          <button id="vPlay" class="primary">▶ <kbd>Space</kbd></button>
          <button id="vRestart" title="最初から">⏮</button>
          <input type="range" id="vSeek" min="0" max="1000" value="0" aria-label="再生位置">
          <span id="vTime">0:00 / 0:00</span>
        </div>
        <div class="row">
          <label class="check"><input type="checkbox" id="videoLoop"> くり返し</label>
          <label class="check"><input type="checkbox" id="videoSound"> 音</label>
          <input type="range" id="videoVolume" min="0" max="1" step="0.05" aria-label="動画の音量">
          <output id="videoVolumeOut"></output>
        </div>
      </div>
      <label class="check small"><input type="checkbox" id="autoPlay"> 動画は出したら再生</label>
      <!-- 動画の音はここで鳴らす（映像は投影画面） -->
      <video id="audioVideo" hidden playsinline></video>
    </section>

    <!-- 設定 -->
    <aside id="settingsCol" class="card">
      <h2>マイク</h2>
      <select id="micSelect" aria-label="使うマイク"><option value="">既定のマイク</option></select>
      <label class="check"><input type="checkbox" id="noiseSuppression"> ノイズ抑制</label>
      <label>感度 <output id="micGainOut"></output>
        <input type="range" id="micGain" min="-12" max="24" step="1">
      </label>
      <label>しきい値 <output id="thresholdOut"></output>
        <input type="range" id="threshold" min="-85" max="-15" step="1">
      </label>

      <h2>口パク</h2>
      <label>開きやすさ <output id="rangeOut"></output>
        <input type="range" id="range" min="8" max="45" step="1">
      </label>
      <label>口の大きさ <output id="mouthScaleOut"></output>
        <input type="range" id="mouthScale" min="0.4" max="1.6" step="0.05">
      </label>

      <h2>声</h2>
      <label class="check warn"><input type="checkbox" id="voiceOut"> PCから声を出す</label>
      <select id="outSelect" aria-label="音を出す先"><option value="">既定のスピーカー</option></select>
      <label>音量 <output id="volumeOut"></output>
        <input type="range" id="volume" min="0" max="1.5" step="0.05">
      </label>
      <label class="check"><input type="checkbox" id="gate"> 小さい音は流さない</label>
      <h3 id="presetName"></h3>
      <div id="presetSliders"></div>
      <button id="presetReset">この声を初期設定に戻す</button>

      <h2>カズオの位置</h2>
      <label>大きさ <output id="charScaleOut"></output>
        <input type="range" id="charScale" min="0.5" max="1.6" step="0.02">
      </label>
      <label>上下 <output id="charYOut"></output>
        <input type="range" id="charY" min="-40" max="40" step="1">
      </label>
    </aside>
  </main>

  <!-- 最初に出る開始カード -->
  <div id="startCard">
    <h1>AIカズオ</h1>
    <button id="startMic" class="primary">マイクを使って開始</button>
    <button id="startNoMic">マイクなしで開始</button>
    <p id="startError" class="error"></p>
  </div>

  <script src="js/settings.js?v=202610270159"></script>
  <script src="characters/config.js?v=202610270159"></script>
  <script src="js/photos.js?v=202610270159"></script>
  <script src="js/audio.js?v=202610270159"></script>
  <script src="js/app.js?v=202610270159"></script>
</body>
</html>
